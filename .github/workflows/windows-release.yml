name: Windows x64 release build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA to build for v0.0.3
        type: string
        required: true
      artwork_scope_confirmed:
        description: Exact embedded baseline artwork distribution was approved
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-v0.0.3
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'elysia090/Goodhand' && inputs.artwork_scope_confirmed &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/oops-v0.0.3')
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      TOOLCHAIN: "1.100.0-x86_64-pc-windows-msvc"
      CARGO_TERM_COLOR: always
    steps:
      - name: Confirm the release source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:SOURCE_SHA -cne $env:GITHUB_SHA) {
              throw "The selected branch commit does not match the requested release source SHA"
          }
      - name: Set release paths on the runner
        shell: pwsh
        run: |
          "GOODHAND_BUILD_DIR=$env:RUNNER_TEMP/goodhand-windows-build" >> $env:GITHUB_ENV
          "GOODHAND_INPUT_DIR=$env:RUNNER_TEMP/goodhand-windows-input" >> $env:GITHUB_ENV
          "GOODHAND_PACKAGE_DIR=$env:RUNNER_TEMP/goodhand-windows-package" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /Cargo.toml
            /Cargo.lock
            /LICENSE
            /src/
            /tools/oops/
            /tools/gray_source.py
            /tools/pack_sequence.py
            /tools/pack_tone.py
            /reference/source-study/pixels.npz
            /reference/source-study/pixels.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify and pack the exact archived baseline
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/oops/release -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "$env:GOODHAND_INPUT_DIR" | Out-Null
          python tools/oops/release/prepare_baseline.py reference/source-study/pixels.npz "$env:GOODHAND_INPUT_DIR/artwork"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build and test the Windows x64 executable
        shell: pwsh
        run: |
          $locator = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $locator -latest -products '*' -property installationPath
          if (-not $vs) { throw "Visual Studio build tools not installed" }
          if (-not (Get-Command sha256sum -ErrorAction SilentlyContinue)) {
              $gitUnix = Join-Path $env:ProgramFiles "Git\usr\bin"
              if (-not (Test-Path (Join-Path $gitUnix "sha256sum.exe"))) {
                  throw "sha256sum is unavailable"
              }
              $env:Path += ";$gitUnix"
          }
          rustup toolchain install "$env:TOOLCHAIN" --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GOODHAND_BASELINE_ARTWORK_DIR = "$env:GOODHAND_INPUT_DIR/artwork"
          $env:CARGO_TARGET_DIR = $env:GOODHAND_BUILD_DIR
          $env:CARGO_ENCODED_RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=Goodhand" +
              [char]31 + "-C" + [char]31 + "target-feature=+crt-static"
          $batch = Join-Path $env:RUNNER_TEMP "goodhand-release.cmd"
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -no_logo -host_arch=x64 -arch=x64
          if errorlevel 1 exit /b 1
          cargo +$env:TOOLCHAIN test --manifest-path tools/oops/Cargo.toml --locked --offline --release --features desktop-window
          if errorlevel 1 exit /b 1
          cargo +$env:TOOLCHAIN build --manifest-path tools/oops/Cargo.toml --locked --offline --release --features desktop-window
          "@ | Set-Content -Path $batch -Encoding ascii
          & cmd.exe /d /c "`"$batch`""
          exit $LASTEXITCODE

      - name: Verify and package the real Windows build
        shell: pwsh
        run: |
          python tools/oops/release/package.py --ci-cli-only `
              --executable "$env:GOODHAND_BUILD_DIR/release/oops.exe" `
              --artwork "$env:GOODHAND_INPUT_DIR/artwork" `
              --artwork-notice tools/oops/release/ARTWORK-BASELINE.txt `
              --output "$env:GOODHAND_PACKAGE_DIR"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "Source commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Native artwork build, not a completed desktop smoke test." >> $env:GITHUB_STEP_SUMMARY

      - name: Remove staged artwork and build intermediates
        if: always()
        shell: pwsh
        run: |
          foreach ($dir in @($env:GOODHAND_INPUT_DIR, $env:GOODHAND_BUILD_DIR)) {
              if (Test-Path -LiteralPath "$dir") {
                  Remove-Item -LiteralPath "$dir" -Force -Recurse
              }
          }

      - name: Upload only the Windows archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oops-v0.0.3-windows-x64
          path: |
            ${{ env.GOODHAND_PACKAGE_DIR }}/oops-v0.0.3-windows-x64.zip
            ${{ env.GOODHAND_PACKAGE_DIR }}/oops-v0.0.3-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 3
