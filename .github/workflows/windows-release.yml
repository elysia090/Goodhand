name: Windows x64 release build

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric GitHub draft release ID for v0.0.1
        type: string
        required: true
      linux_asset_id:
        description: Numeric asset ID for the approved Linux x64 release archive
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-v0.0.1
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'elysia090/Goodhand' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      TOOLCHAIN: "1.100.0-x86_64-pc-windows-msvc"
      CARGO_TERM_COLOR: always
      GOODHAND_BUILD_DIR: ${{ runner.temp }}/goodhand-windows-build
      GOODHAND_INPUT_DIR: ${{ runner.temp }}/goodhand-windows-input
      GOODHAND_PACKAGE_DIR: ${{ runner.temp }}/goodhand-windows-package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /Cargo.toml
            /Cargo.lock
            /LICENSE
            /src/
            /tools/oops/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Retrieve the pinned approved release binary
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          LINUX_ASSET_ID: ${{ inputs.linux_asset_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_ID -cnotmatch '^[1-9][0-9]{0,14}$' -or
              $env:LINUX_ASSET_ID -cnotmatch '^[1-9][0-9]{0,14}$') {
              throw "Use numeric release and asset IDs"
          }
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $baseUrl = "${env:GITHUB_API_URL}/repos/${env:GITHUB_REPOSITORY}/releases"
          try {
              $draft = Invoke-RestMethod -ErrorAction Stop -TimeoutSec 20 -Method Get `
                  -Uri "$baseUrl/$env:RELEASE_ID" -Headers $headers
          } catch {
              throw "The specified draft release is not readable with the workflow's read-only token"
          }
          if ($draft.id -ne [long]$env:RELEASE_ID -or -not $draft.draft -or $draft.tag_name -cne "v0.0.1") {
              throw "The source must be the v0.0.1 draft release"
          }
          $asset = @($draft.assets | Where-Object { $_.id -eq [long]$env:LINUX_ASSET_ID })
          if ($asset.Count -ne 1 -or $asset[0].name -cne "oops-v0.0.1-linux-x64.tar.gz" -or
              $asset[0].state -ne "uploaded") {
              throw "The selected Linux x64 archive is not in that draft release"
          }
          New-Item -ItemType Directory -Path "$env:GOODHAND_INPUT_DIR" | Out-Null
          $archive = Join-Path "$env:GOODHAND_INPUT_DIR" "oops-v0.0.1-linux-x64.tar.gz"
          # curl forwards the Authorization header only to the original host.
          curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' `
              --connect-timeout 10 --max-time 60 --max-filesize 16777216 `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --header "Accept: application/octet-stream" `
              --header "X-GitHub-Api-Version: 2022-11-28" `
              --output "$archive" "$baseUrl/assets/$env:LINUX_ASSET_ID"
          if ($LASTEXITCODE) { throw "Could not download the approved archive" }

      - name: Verify and stage approved embedded artwork
        shell: pwsh
        run: |
          python -m unittest discover -s tools/oops/release -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/oops/release/extract_linux_artwork.py `
              "$env:GOODHAND_INPUT_DIR/oops-v0.0.1-linux-x64.tar.gz" "$env:GOODHAND_INPUT_DIR/artwork"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build and test the Windows x64 executable
        shell: pwsh
        run: |
          $locator = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $locator -latest -products '*' -property installationPath
          if (-not $vs) { throw "Visual Studio build tools not installed" }
          if (-not (Get-Command sha256sum -ErrorAction SilentlyContinue)) {
              $gitUnix = Join-Path $env:ProgramFiles "Git\usr\bin"
              if (-not (Test-Path (Join-Path $gitUnix "sha256sum.exe"))) {
                  throw "sha256sum is unavailable"
              }
              $env:Path += ";$gitUnix"
          }
          rustup toolchain install "$env:TOOLCHAIN" --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GOODHAND_RELEASE_ARTWORK_DIR = "$env:GOODHAND_INPUT_DIR/artwork"
          $env:CARGO_TARGET_DIR = $env:GOODHAND_BUILD_DIR
          $env:CARGO_ENCODED_RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=Goodhand" +
              [char]31 + "-C" + [char]31 + "target-feature=+crt-static"
          $batch = Join-Path $env:RUNNER_TEMP "goodhand-release.cmd"
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -no_logo -host_arch=x64 -arch=x64
          if errorlevel 1 exit /b 1
          cargo +$env:TOOLCHAIN test --manifest-path tools/oops/Cargo.toml --locked --offline --release --features desktop-window
          if errorlevel 1 exit /b 1
          cargo +$env:TOOLCHAIN build --manifest-path tools/oops/Cargo.toml --locked --offline --release --features desktop-window
          "@ | Set-Content -Path $batch -Encoding ascii
          & cmd.exe /d /c "`"$batch`""
          exit $LASTEXITCODE

      - name: Verify and package the real Windows build
        shell: pwsh
        run: |
          python tools/oops/release/package.py --ci-cli-only `
              --executable "$env:GOODHAND_BUILD_DIR/release/oops.exe" `
              --artwork "$env:GOODHAND_INPUT_DIR/artwork" `
              --artwork-notice "$env:GOODHAND_INPUT_DIR/artwork/ARTWORK-LICENSE.txt" `
              --output "$env:GOODHAND_PACKAGE_DIR"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "Native artwork build, not a completed desktop smoke test." >> $env:GITHUB_STEP_SUMMARY

      - name: Remove staged artwork and build intermediates
        if: always()
        shell: pwsh
        run: |
          foreach ($dir in @($env:GOODHAND_INPUT_DIR, $env:GOODHAND_BUILD_DIR)) {
              if (Test-Path -LiteralPath "$dir") {
                  Remove-Item -LiteralPath "$dir" -Force -Recurse
              }
          }

      - name: Upload only the Windows archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oops-v0.0.1-windows-x64
          path: |
            ${{ env.GOODHAND_PACKAGE_DIR }}/oops-v0.0.1-windows-x64.zip
            ${{ env.GOODHAND_PACKAGE_DIR }}/oops-v0.0.1-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 3
