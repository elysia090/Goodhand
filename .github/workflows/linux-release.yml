name: Linux x64 release build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged source commit SHA for v0.0.4
        required: true
        type: string
      artwork_scope_confirmed:
        description: Distribution of the exact embedded baseline artwork was approved
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-release-v0.0.4
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.repository == 'elysia090/Goodhand' &&
      github.ref == 'refs/heads/main' &&
      inputs.artwork_scope_confirmed
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      # The workflow can live on a later main commit; compile neither that
      # commit nor an arbitrary input ref. Keep the same product source as Windows.
      RELEASE_SOURCE_SHA: c94183a143558c9bc5fefa2c46db0e613152d008
      RELEASE_SOURCE_TREE: 7634fc7d5979151c81aadc1597e57349d3f26b65
      TOOLCHAIN: 1.100.0-x86_64-unknown-linux-gnu
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Confirm the approved source pin
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$REQUESTED_SOURCE_SHA" != "$RELEASE_SOURCE_SHA" ]]; then
            echo 'Requested SHA does not match the merged v0.0.4 source pin' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /Cargo.toml
            /Cargo.lock
            /LICENSE
            /src/
            /tools/oops/
            /tools/gray_source.py
            /tools/pack_sequence.py
            /tools/pack_tone.py
            /reference/source-study/pixels.npz
            /reference/source-study/pixels.json

      - name: Verify the checkout, architecture and glibc floor
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RELEASE_SOURCE_TREE"
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          printf 'GOODHAND_WORK=%s\n' "$(mktemp -d "$RUNNER_TEMP/goodhand-linux-x64.XXXXXX")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Linux desktop dependencies on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libgtk-3-0 xauth xvfb x11-utils

      - name: Validate and pack the exact archived baseline
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -m unittest discover -s tools/oops/release -p 'test_*.py'
          python tools/oops/release/prepare_baseline.py \
            reference/source-study/pixels.npz "$GOODHAND_WORK/artwork"

      - name: Build and test the Linux x64 executable
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          export GOODHAND_BASELINE_ARTWORK_DIR="$GOODHAND_WORK/artwork"
          export CARGO_TARGET_DIR="$GOODHAND_WORK/build"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/goodhand --remap-path-prefix=$GOODHAND_WORK=/goodhand-build"
          manifest=tools/oops/Cargo.toml
          cargo +"$TOOLCHAIN" test --manifest-path "$manifest" --locked --offline --release --features desktop-window
          cargo +"$TOOLCHAIN" build --manifest-path "$manifest" --locked --offline --release --features desktop-window
          required=$(readelf --version-info "$CARGO_TARGET_DIR/release/oops" |
            grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | cut -d_ -f2 | sort -Vu | tail -1)
          test -n "$required"
          if [[ "$(printf '%s\n' "$required" 2.35 | sort -V | tail -1)" != 2.35 ]]; then
            echo "Executable requires glibc $required; expected at most 2.35" >&2
            exit 1
          fi

      - name: Run the full native smoke gate and package
        env:
          GDK_BACKEND: x11
        run: |
          timeout 90s xvfb-run --auto-servernum \
            --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            bash -euo pipefail -s <<'BASH'
          [[ "$DISPLAY" =~ ^:[0-9]+$ ]]
          test -s "$XAUTHORITY"
          xdpyinfo >/dev/null
          if XAUTHORITY=/dev/null xdpyinfo >/dev/null 2>&1; then
            echo 'Refusing to package on an unauthenticated X display' >&2
            exit 1
          fi
          python tools/oops/release/package.py \
            --executable "$GOODHAND_WORK/build/release/oops" \
            --artwork "$GOODHAND_WORK/artwork" \
            --artwork-notice tools/oops/release/ARTWORK-BASELINE.txt \
            --output "$GOODHAND_WORK/package"
          BASH

      - name: Verify package checksums and record provenance
        run: |
          cd "$GOODHAND_WORK/package"
          base=oops-v0.0.4-linux-x64
          archive="$base.tar.gz"
          sha256sum --check "$archive.sha256"
          executable_sha=$(sha256sum "$GOODHAND_WORK/build/release/oops" | cut -d' ' -f1)
          test "$(tar -xOzf "$archive" "$base/oops" | sha256sum | cut -d' ' -f1)" = "$executable_sha"
          test "$(tar -xOzf "$archive" "$base/EXECUTABLE.sha256")" = "$executable_sha  oops"
          archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)
          {
            printf 'Source commit: `%s`\n\n' "$RELEASE_SOURCE_SHA"
            printf 'Source tree: `%s`\n\n' "$RELEASE_SOURCE_TREE"
            printf 'Workflow commit: `%s`\n\n' "$GITHUB_WORKFLOW_SHA"
            printf 'Executable SHA-256: `%s`\n\n' "$executable_sha"
            printf 'Archive SHA-256: `%s`\n\n' "$archive_sha"
            echo 'Completed the 45-second X11 smoke test. This does not verify a physical display or Wayland.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only the Linux archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oops-v0.0.4-linux-x64
          path: |
            ${{ env.GOODHAND_WORK }}/package/oops-v0.0.4-linux-x64.tar.gz
            ${{ env.GOODHAND_WORK }}/package/oops-v0.0.4-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
