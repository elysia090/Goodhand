name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No release, deployment, write token, custom secret, artifact upload, or asset input.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python synthetic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out Python source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/*.py
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install offline-tool test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'Pillow==13.0.0'
      - name: Run all synthetic Python contracts
        # Synthetic temporary NPZ/PNG fixtures only; no source video or artwork.
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  rust:
    name: Rust 1.100.0 quality and library builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: '1.100.0'
    steps:
      - name: Check out Rust source and synthetic tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          # Cargo fingerprints nested build scripts using ancestor ignore rules.
          # Fetch this text file too so it exists in the sparse, partial clone.
          sparse-checkout: |
            /.gitignore
            /Cargo.toml
            /Cargo.lock
            /src/
            /tests/
            /tools/oops/
      - name: Set up the validated Rust toolchain
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - name: Check Clippy warnings
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings
      - name: Test debug profile
        run: cargo +"$RUST_TOOLCHAIN" test --locked
      - name: Test release profile
        run: cargo +"$RUST_TOOLCHAIN" test --locked --release
      - name: Build the native release library
        run: cargo +"$RUST_TOOLCHAIN" build --locked --release --lib
      - name: Build the Wasm release library
        # Compilation only; not a browser, terminal, or performance test.
        run: cargo +"$RUST_TOOLCHAIN" build --locked --release --lib --target wasm32-unknown-unknown

      - name: Check the terminal pilot
        run: |
          manifest=tools/oops/Cargo.toml
          cargo +"$RUST_TOOLCHAIN" fmt --manifest-path "$manifest" --all -- --check
          cargo +"$RUST_TOOLCHAIN" clippy --manifest-path "$manifest" --offline --locked --all-targets -- -D warnings
          cargo +"$RUST_TOOLCHAIN" test --manifest-path "$manifest" --offline --locked
          cargo +"$RUST_TOOLCHAIN" test --manifest-path "$manifest" --offline --release --locked
          cargo +"$RUST_TOOLCHAIN" build --manifest-path "$manifest" --offline --release --locked
          # Kernel PTY only. No GUI/presentation or artwork acceptance claim.
          python3 tools/oops/tests/pty_smoke.py tools/oops/target/release/oops --full

      - name: Check the embedded playback build with synthetic inputs
        run: |
          fixture="$RUNNER_TEMP/review-fixture"
          manifest=tools/oops/Cargo.toml
          python3 tools/oops/tests/make_review_fixture.py "$fixture"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/embedded-playback"
          GOODHAND_PLAYBACK_DIR="$fixture" cargo +"$RUST_TOOLCHAIN" clippy --manifest-path "$manifest" --offline --locked --all-targets -- -D warnings
          GOODHAND_PLAYBACK_DIR="$fixture" cargo +"$RUST_TOOLCHAIN" test --manifest-path "$manifest" --offline --locked --release
          GOODHAND_PLAYBACK_DIR="$fixture" cargo +"$RUST_TOOLCHAIN" build --manifest-path "$manifest" --offline --locked --release
          python3 tools/oops/tests/pty_smoke.py "$CARGO_TARGET_DIR/release/oops"
          if GOODHAND_TONE_PROFILE=w5 GOODHAND_PLAYBACK_DIR="$fixture" cargo +"$RUST_TOOLCHAIN" check --manifest-path "$manifest" --offline --locked > "$RUNNER_TEMP/w5-guard.log" 2>&1; then
            echo "W5 accepted a different archive"
            exit 1
          fi
          grep -F 'W5 requires the exact reviewed W4 archive' "$RUNNER_TEMP/w5-guard.log"
          mv "$fixture/tone.ght" "$fixture/valid.ght"
          if GOODHAND_PLAYBACK_DIR="$fixture" cargo +"$RUST_TOOLCHAIN" check --manifest-path "$manifest" --offline --locked; then
            echo "Embedded build accepted a missing tone archive" >&2
            exit 1
          fi
          printf 'broken' > "$fixture/tone.ght"
          if GOODHAND_PLAYBACK_DIR="$fixture" cargo +"$RUST_TOOLCHAIN" check --manifest-path "$manifest" --offline --locked; then
            echo "Embedded build accepted an invalid tone archive" >&2
            exit 1
          fi

  msrv:
    # Cargo.toml declares 1.70; it has NOT been executed locally.
    # This blocking job tests that compatibility target on the first CI run.
    name: Rust 1.70 compatibility target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: '1.70.0'
    steps:
      - name: Check out Rust source and synthetic tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /src/
            /tests/
      - name: Set up the declared minimum toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Test the declared minimum toolchain
        run: cargo +"$RUST_TOOLCHAIN" test --locked
      - name: Build the native library on the declared minimum
        run: cargo +"$RUST_TOOLCHAIN" build --locked --release --lib
