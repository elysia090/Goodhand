# Optional oops display settings. Load with: oops --config oops.example.conf
# Lines are "key = value"; '#' starts a comment.
# Change either value here, or override it for one run with CLI options.

# Integer percentage (50–200). 100 fits the model frame; above 100 may crop.
zoom = 100

# "auto" uses a usable TTY pixel size, otherwise 0.50 (width/height).
# Set a measured width/height ratio from 0.30 to 0.85 to override it.
cell_aspect = auto
