# Optional oops settings. Copy this file and pass it with --config PATH.
# Uncomment only the settings you want to override. This file as written
# keeps the defaults: a 45-second window turn or a 30-second terminal turn.

# Shared: 12–60 whole seconds per turn. The example applies to either mode.
# duration = 22
# reverse follows the original order; forward starts at the same pose.
# direction = reverse

# Window only. safe is the opaque near-black default. clear and framed
# require a composited Linux desktop; Windows and macOS support only safe.
# window_appearance = safe

# Terminal only (also used by --check and --measure).
# 50–200 percent; 100 fits the full turn; values above 100 may crop.
# zoom = 100
# auto uses TTY pixel geometry where available, otherwise 0.50. A measured
# width/height ratio in 0.30–0.85 overrides it.
# cell_aspect = auto
# Shift artwork by -50 to 50 percent of the drawable width or height.
# Positive x goes right, positive y goes down. A shift may crop.
# offset_x = 0
# offset_y = 0
# Gray gain: 0–200 percent. At 0, marks stay occupied but are black.
# brightness = 100
# braille packs 2x4 dots per cell; dots shows one bullet per cell.
# renderer = braille
