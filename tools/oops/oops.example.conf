# Optional oops playback settings. Load with: oops --config oops.example.conf
# Lines are "key = value"; '#' starts a comment.
# Change any value here, or override the shared/terminal settings with CLI options.

# Island: safe opaque black (default), clear transparent, or framed translucent.
window_appearance = safe

# The grid, gain and font settings below apply only to --terminal.

# Integer percentage (50–200). 100 fits the full turn; above 100 may crop.
zoom = 100

# "auto" uses a usable TTY pixel size, otherwise 0.50 (width/height).
# Set a measured width/height ratio from 0.30 to 0.85 to override it.
cell_aspect = auto

# Shared: duration in 12–60 whole seconds. Use --once to play only one.
duration = 30

# Shared: "reverse" is the reviewed order. "forward" starts at the same pose
# and turns the other way; it does not reflect the picture.
direction = reverse

# Signed percentages of the drawable width and height (-50 to 50).
# Positive x moves right, positive y moves down. A shift may crop the art.
offset_x = 0
offset_y = 0

# Gray gain (0–200%), rounded and clamped. At 0, marks are black but occupied.
brightness = 100

# Braille packs a 2x4 dot grid in each cell. Use dots for one bullet per cell.
renderer = braille
